name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout committed source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 34 build tools
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build and verify signed APK
        run: |
          chmod +x android/build.sh
          android/build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aevren-android-v0.3.8.12
          path: android/Zhangxinchuang-public-v0.3.8.12.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.8.12
          name: 砚团 v0.3.8.12
          body: |
            桌宠 embodiment 状态层：互动有余韵，拖拽、轻放、旋转、晃动和撞边会持续影响后续反应。
            构建来源：${{ github.sha }}
          files: android/Zhangxinchuang-public-v0.3.8.12.apk
          fail_on_unmatched_files: true
