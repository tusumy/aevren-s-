name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout committed source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build and verify signed APK
        run: |
          chmod +x android/build.sh
          android/build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aevren-android-v0.3.8.10
          path: android/Zhangxinchuang-public-v0.3.8.10.apk
          if-no-files-found: error
          retention-days: 14
