name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout committed source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 34 build tools
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Run Python regressions
        run: |
          for test_file in android/tests/test_*.py; do
            python "$test_file"
          done

      - name: Run activity event filter regression
        run: |
          mkdir -p /tmp/activity-event-filter-test
          javac -d /tmp/activity-event-filter-test \
            android/app/src/main/java/dev/linjian/peek/ActivityEventFilter.java \
            android/tests/ActivityEventFilterTest.java
          java -cp /tmp/activity-event-filter-test dev.linjian.peek.ActivityEventFilterTest

      - name: Validate MCP and server syntax
        run: |
          node --check mcp/server.js
          node --check server/cloudflare-worker/worker.js
          python -m py_compile server/linjian_server.py

      - name: Build and verify signed APK
        run: |
          chmod +x android/build.sh
          android/build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aevren-android-v0.3.9.5
          path: android/Zhangxinchuang-public-v0.3.9.5.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.9.5
          name: 砚团 v0.3.9.5
          body: |
            新增「一起看·录12秒」：手机主动授权采集6帧画面与可捕获的应用播放声音，通过短期存储接入 MCP；提供可随时停止的前台通知。
            构建来源：${{ github.sha }}
          files: android/Zhangxinchuang-public-v0.3.9.5.apk
          fail_on_unmatched_files: true
